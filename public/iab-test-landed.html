<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Landed</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0;
         padding: 40px 20px; max-width: 30rem; margin-inline: auto; text-align: center; }
  #where { font-size: 1.5rem; font-weight: 700; margin: 18px 0 6px; }
  #ua { margin-top: 18px; padding: 11px; border-radius: 10px; text-align: left;
        background: rgba(128,128,128,.1); font-family: ui-monospace, Menlo, monospace;
        font-size: .7rem; word-break: break-all; -webkit-user-select: text; user-select: text; }
  a { display: inline-block; margin-top: 22px; padding: 13px 22px; border-radius: 10px;
      background: #0071e3; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <h1>✅ Navigation works</h1>
  <div id="where">…</div>
  <p id="hint"></p>
  <div id="ua"></div>
  <a href="/iab-test.html">Back to the test</a>

<script>
  var ua = navigator.userAgent;
  var inIG = /Instagram/i.test(ua);
  var inFB = /FBAN|FBAV|FBIOS/i.test(ua);
  var el = document.getElementById("where");
  var hint = document.getElementById("hint");

  if (inIG) {
    el.textContent = "🟠 Still inside Instagram";
    hint.textContent = "The escape did not happen — this is still the in-app browser.";
  } else if (inFB) {
    el.textContent = "🔵 Inside the Facebook browser";
    hint.textContent = "Still an in-app browser.";
  } else {
    el.textContent = "🟢 Real Safari — escaped!";
    hint.textContent = "No in-app browser token in the UA. The punt to Safari worked.";
  }
  document.getElementById("ua").textContent = ua;
</script>
</body>
</html>
